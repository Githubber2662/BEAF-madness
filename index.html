<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAF-madness: Multiplicative Incremental Game</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; min-height: 100vh; font-family: 'Segoe UI', sans-serif; color: #333; background: linear-gradient(135deg, #667eea, #764ba2); }
    .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .panel { padding: 20px; background: white; border-radius: 10px; box-shadow: 0 10px 30px #0004; }
    .main-section { grid-column: 1 / -1; text-align: center; }
    .currency-display { padding: 30px; margin-bottom: 15px; color: white; background: linear-gradient(135deg, #f093fb, #f5576c); border-radius: 10px; }
    .currency-value { font-size: 2.5em; font-weight: bold; word-break: break-all; }
    .big-button { width: 100%; padding: 25px; color: white; background: linear-gradient(135deg, #667eea, #764ba2); border: 0; border-radius: 10px; cursor: pointer; font-size: 1.5em; font-weight: bold; }
    .toolbar, .button-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    button { padding: 7px 10px; color: white; background: #667eea; border: 0; border-radius: 5px; cursor: pointer; }
    button:hover { background: #764ba2; } button:disabled { background: #bbb; cursor: not-allowed; }
    h2 { margin-top: 0; color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
    .item { padding: 12px; margin-bottom: 10px; background: #f9f9f9; border-left: 4px solid #667eea; border-radius: 5px; }
    .item-desc { margin: 5px 0; color: #666; font-size: .85em; }
    .item-cost { color: #764ba2; font-size: .8em; font-weight: bold; }
    .count { padding: 2px 7px; margin-left: 4px; color: white; background: #667eea; border-radius: 3px; font-size: .8em; }
    input { width: 80px; padding: 5px; }
    @media (max-width: 800px) { .container { grid-template-columns: 1fr; } .main-section { grid-column: auto; } }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel main-section">
      <div class="currency-display">
        <div>Your Currency</div><div class="currency-value" id="currencyDisplay">1</div>
        <div>Click multiplier: <span id="clickMultiplierDisplay">1.1x</span></div>
        <div>Passive multiplier: <span id="passiveMultiplierDisplay">1x</span></div>
      </div>
      <button class="big-button" onclick="game.click(); updateUI()">CLICK FOR ×<span id="clickPower">1.1</span></button>
      <div class="toolbar">
        <button onclick="game.maxAllUpgrades(); updateUI()">Max All Upgrades</button>
        <button onclick="game.save()">Save</button><button onclick="game.load(); updateUI()">Load</button>
        <button onclick="game.start(); updateUI()">Start</button><button onclick="game.stop(); updateUI()">Stop</button>
        <button onclick="exportSave()">Export</button><button onclick="importSave()">Import</button><button onclick="game.hardReset()">Hard Reset</button>
      </div>
    </section>
    <section class="panel"><h2>Autobuyers</h2><div id="autobuyersContainer"></div></section>
    <section class="panel"><h2>Upgrades</h2><div id="upgradesContainer"></div></section>
    <section class="panel"><h2>Buildings</h2><div id="buildingsContainer"></div></section>
    <section class="panel"><h2>Statistics</h2><div id="statisticsContainer"></div></section>
    <section class="panel"><h2>Challenges</h2><div id="challengesContainer"></div></section>
  </div>

  <script src="metanum.js"></script><script src="game.js"></script>
  <script>
    let game;
    const display = value => { try { return String(value); } catch (_) { return ''; } };
    const format = (value, length = 30) => { const text = display(value); return text.length > length ? text.slice(0, length) + '…' : text; };
    const refresh = action => { action(); updateUI(); };

    function updateUI() {
      if (!game) return;
      const state = game.getState();
      document.getElementById('currencyDisplay').textContent = format(state.currency, 50);
      document.getElementById('clickMultiplierDisplay').textContent = display(state.clickMultiplier) + 'x';
      document.getElementById('passiveMultiplierDisplay').textContent = display(state.passiveMultiplier) + 'x';
      document.getElementById('clickPower').textContent = display(state.clickMultiplier);

      const autobuyerFocused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#autobuyersContainer input[type="number"]');
      if (!autobuyerFocused) {
        document.getElementById('autobuyersContainer').innerHTML = Object.entries(state.autobuyers).map(([type, autobuyer]) => `
          <div class="item"><b>${type[0].toUpperCase() + type.slice(1)} autobuyer</b>
            <div class="button-row"><button onclick="refresh(() => game.toggleAutobuyer('${type}'))">${autobuyer.enabled ? 'Disable' : 'Enable'}</button>
            <label>Interval <input type="number" min="20" step="1" value="${autobuyer.intervalMs}" onchange="game.setAutobuyerInterval('${type}', this.value); game.save(); updateUI()"> ms</label></div>
          </div>`).join('');
      }

      document.getElementById('upgradesContainer').innerHTML = Object.entries(state.upgrades).map(([key, upgrade]) => `
        <div class="item"><b>${upgrade.name} <span class="count">${upgrade.owned}</span></b>
          <div class="item-desc">${upgrade.description} · Hyper: ${upgrade.hyper}</div><div class="item-cost">Cost: ${format(upgrade.cost)}</div>
          <div class="button-row"><button onclick="refresh(() => game.buyUpgrade('${key}', 1))">×1</button><button onclick="refresh(() => game.buyUpgrade('${key}', 10))">×10</button><button onclick="refresh(() => game.buyUpgrade('${key}', 100))">×100</button><button onclick="refresh(() => game.buyUpgrade('${key}', 'max'))">Max</button></div>
        </div>`).join('');

      document.getElementById('buildingsContainer').innerHTML = Object.entries(state.buildings).map(([key, building]) => `
        <div class="item"><b>${building.name} <span class="count">${building.owned}</span></b>
          <div class="item-desc">${building.description}</div><div class="item-cost">Cost: ${format(building.cost)}</div>
          <div class="button-row"><button onclick="refresh(() => game.buyBuilding('${key}', 1))">×1</button><button onclick="refresh(() => game.buyBuilding('${key}', 10))">×10</button><button onclick="refresh(() => game.buyBuilding('${key}', 100))">×100</button><button onclick="refresh(() => game.buyBuilding('${key}', 'max'))">Max</button></div>
        </div>`).join('');

      const total = values => Object.values(values).reduce((sum, item) => sum.add(new MetaNum(item.owned)), new MetaNum(0));
      document.getElementById('statisticsContainer').innerHTML = `<div class="item">Total upgrades: ${total(state.upgrades)}</div><div class="item">Total buildings: ${total(state.buildings)}</div><div class="item">Game: ${state.isRunning ? 'Running' : 'Stopped'}</div>`;
      document.getElementById('challengesContainer').innerHTML = Object.entries(state.challenges).map(([id, challenge]) => `
        <div class="item"><b>${challenge.name} ${state.activeChallenge === id ? '<span class="count">Active</span>' : ''}</b><div class="item-desc">${challenge.description}</div>
        <button onclick="refresh(() => game.startChallenge('${id}'))">Start</button> <button onclick="refresh(() => game.endChallenge())">Stop</button>
        ${(challenge.goals || []).map(goal => `<div>${goal.description}${goal.completed ? ' (Completed)' : ''}${goal.claimed ? ' (Claimed)' : ''}</div>`).join('')}</div>`).join('');
    }

    function exportSave() { const save = game.exportSave(); if (navigator.clipboard) navigator.clipboard.writeText(save); alert('Save copied to clipboard'); }
    function importSave() { const save = prompt('Paste save JSON here'); if (save) { game.importSave(save); updateUI(); } }
    function init() { game = new Game(); game.load(); game.start(); updateUI(); }
    setInterval(updateUI, 20); window.addEventListener('load', init);
  </script>
</body>
</html>
