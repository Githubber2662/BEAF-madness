<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAF-madness: Multiplicative Incremental Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }
    
    .panel {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .main-section {
      grid-column: 1 / -1;
      text-align: center;
    }
    
    .currency-display {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 40px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .currency-value {
      font-size: 2.5em;
      font-weight: bold;
      word-break: break-all;
    }
    
    .currency-label {
      font-size: 0.9em;
      opacity: 0.9;
      margin-top: 10px;
    }
    
    .big-button {
      width: 100%;
      padding: 30px;
      font-size: 1.5em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
    }
    
    .big-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .big-button:active {
      transform: translateY(0);
    }
    
    h2 {
      color: #667eea;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    h3 {
      color: #764ba2;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 0.95em;
    }
    
    .item {
      background: #f9f9f9;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }
    
    .item-name {
      font-weight: bold;
      color: #333;
    }
    
    .item-desc {
      font-size: 0.85em;
      color: #666;
      margin: 5px 0;
    }
    
    .item-cost {
      font-size: 0.8em;
      color: #764ba2;
      font-weight: bold;
    }
    
    .item-button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85em;
      transition: background 0.2s;
    }
    
    .item-button:hover {
      background: #764ba2;
    }
    
    .item-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .multiplier-display {
      font-size: 0.85em;
      color: #667eea;
      margin-top: 5px;
      font-weight: bold;
    }
    
    .count {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.8em;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel main-section">
      <div class="currency-display">
        <div class="currency-label">Your Currency</div>
        <div class="currency-value" id="currencyDisplay">1</div>
        <div class="currency-label">Click multiplier: <span id="clickMultiplierDisplay">1.00x</span></div>
        <div class="currency-label">Passive multiplier: <span id="passiveMultiplierDisplay">1.00x</span></div>
      </div>
      <button class="big-button" onclick="game.click(); updateUI();">CLICK FOR ×<span id="clickPower">1.00</span></button>
    </div>
    
    <div class="panel">
      <h2>Upgrades</h2>
      <div id="upgradesContainer"></div>
    </div>
    
    <div class="panel">
      <h2>Buildings</h2>
      <div id="buildingsContainer"></div>
    </div>
    
    <div class="panel">
      <h2>Statistics</h2>
      <div id="statisticsContainer"></div>
    </div>
  </div>
  
  <script src="metanum.js"></script>
  <script src="game.js"></script>
  <script>
    let game;
    
    // Initialize game
    function init() {
      game = new Game();
      game.start();
      updateUI();
    }
    
    // Update UI every frame
    function updateUI() {
      const state = game.getState();
      
      // Update currency display
      const currencyStr = state.currency;
      document.getElementById('currencyDisplay').textContent = 
        currencyStr.length > 50 ? currencyStr.substring(0, 50) + '...' : currencyStr;
      
      // Update multiplier displays
      document.getElementById('clickMultiplierDisplay').textContent = 
        formatNumber(state.clickMultiplier);
      document.getElementById('passiveMultiplierDisplay').textContent = 
        formatNumber(state.passiveMultiplier);
      
      // Update upgrades
      let upgradesHTML = '';
      for (let [key, upgrade] of Object.entries(state.upgrades)) {
        const canAfford = game.currency.gte(upgrade.cost);
        upgradesHTML += `
          <div class="item">
            <div class="item-name">${upgrade.name} <span class="count">${upgrade.owned}</span></div>
            <div class="item-desc">${upgrade.description}</div>
            <div class="item-cost">Cost: ${formatLargeNumber(upgrade.cost)}</div>
            <button class="item-button" ${!canAfford ? 'disabled' : ''} onclick="game.buyUpgrade('${key}'); updateUI();">
              Buy
            </button>
          </div>
        `;
      }
      document.getElementById('upgradesContainer').innerHTML = upgradesHTML;
      
      // Update buildings
      let buildingsHTML = '';
      for (let [key, building] of Object.entries(state.buildings)) {
        const canAfford = game.currency.gte(building.cost);
        buildingsHTML += `
          <div class="item">
            <div class="item-name">${building.name} <span class="count">${building.owned}</span></div>
            <div class="item-desc">${building.description}</div>
            <div class="item-cost">Cost: ${formatLargeNumber(building.cost)}</div>
            <button class="item-button" ${!canAfford ? 'disabled' : ''} onclick="game.buyBuilding('${key}'); updateUI();">
              Buy
            </button>
          </div>
        `;
      }
      document.getElementById('buildingsContainer').innerHTML = buildingsHTML;
      
      // Update statistics
      const stats = `
        <div class="item">
          <div class="item-name">Total Upgrades Owned</div>
          <div class="multiplier-display">${Object.values(state.upgrades).reduce((sum, u) => MetaNum.add(sum, u.owned), new MetaNum(0))}</div>
        </div>
        <div class="item">
          <div class="item-name">Total Buildings Owned</div>
          <div class="multiplier-display">${Object.values(state.buildings).reduce((sum, b) => MetaNum.add(sum, b.owned), new MetaNum(0))}</div>
        </div>
      `;
      document.getElementById('statisticsContainer').innerHTML = stats;
    }
    
    // Format large numbers for display
    function formatLargeNumber(numStr) {
      if (numStr.length <= 20) {
        return numStr.toString();
      return numStr.substring(0, 20) + (numStr.length > 20 ? '...' : '');
    }
    
    // Format numbers with multiplier notation
    function formatNumber(numStr) {
      const num = numStr;
      return num.toFixed(3) + 'x';
    }
    
    // Update UI every 1ms
    setInterval(updateUI, 1);
    
    // Initialize on page load
    window.addEventListener('load', init);
  </script>
</body>
</html>
